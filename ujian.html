<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ujian Siswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: sans-serif; }
        .hidden { display: none !important; }
        .grid-soal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .btn-nomor { border-radius: 8px; font-weight: bold; width: 100%; height: 42px; border:1px solid #ccc; background:#e0e0e0; }
        .bg-hijau { background: #2ecc71; color: white; border: none; }
        .bg-kuning { background: #f1c40f; color: white; border: none; }
        .active-soal { border: 3px solid #3498db; transform: scale(1.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3" id="main-nav">
    <div class="container d-flex justify-content-between text-white">
        <h5>CBT Siswa</h5>
        <div><span id="nama-siswa" class="me-3"></span> <button class="btn btn-sm btn-danger" onclick="logout()">Keluar</button></div>
    </div>
</nav>

<div class="container mt-4" id="dashboard">
    <h4>Jadwal Ujian Tersedia</h4><hr>
    <div class="row" id="list-ujian">Mencari ujian aktif...</div>
</div>

<div class="modal fade" id="modalToken" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <h5>Masukkan Token Ujian</h5><p id="lbl-ujian"></p>
      <input type="text" id="input-token" class="form-control text-center fw-bold mb-3">
      <button class="btn btn-success w-100" onclick="validasi()">Mulai Ujian</button>
    </div>
  </div>
</div>

<div id="exam-engine" class="hidden">
    <div class="bg-dark text-white p-3 d-flex justify-content-between sticky-top">
        <h5 id="judul-ujian"></h5>
        <h4 class="bg-danger px-3 py-1 rounded" id="timer">--:--:--</h4>
    </div>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card p-4">
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                        <h5>Soal <span id="no-soal">1</span></h5>
                        <div><input type="checkbox" id="cek-ragu" onchange="tandaiRagu()"> <label class="text-warning fw-bold">Ragu</label></div>
                    </div>
                    <div id="tanya" class="fs-5 mb-4">Loading...</div>
                    <div id="opsi"></div>
                    <div class="d-flex justify-content-between mt-4">
                        <button class="btn btn-secondary" onclick="nav(-1)">Kembali</button>
                        <button class="btn btn-primary" onclick="nav(1)">Lanjut</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 text-center">
                    <h6>Navigasi Soal</h6>
                    <div class="grid-soal mb-4" id="grid"></div>
                    <button class="btn btn-danger w-100 fw-bold py-2" onclick="submitAkhir()">KUMPULKAN</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbybpeIedWVkMeqxwytE3acxqs8iGQURFALWL8ANCdLymf9m0CYZSK1ndCSWUJug1DFw0w/exec';
    
    async function fetchAPI(action, payload = {}) {
        payload.action = action; payload.user_id = localStorage.getItem('cbt_user_id'); payload.kelas = localStorage.getItem('cbt_kelas');
        return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) }).then(r=>r.json());
    }

    let aId = '', sData = [], jData = {}, cIdx = 0, tInt, mToken;

    window.onload = () => {
        if(localStorage.getItem('cbt_role') !== 'Peserta') window.location.href = 'index.html';
        document.getElementById('nama-siswa').innerText = localStorage.getItem('cbt_nama');
        mToken = new bootstrap.Modal(document.getElementById('modalToken'));
        
        if(localStorage.getItem('run_exam')) resumeUjian(localStorage.getItem('run_exam'));
        else loadUjian();
    };

    async function loadUjian() {
        let res = await fetchAPI('getPesertaData');
        if(res.status === 'success') {
            document.getElementById('list-ujian').innerHTML = res.data.map(u => 
                `<div class="col-md-4 mb-3"><div class="card p-3 shadow-sm"><h5>${u.mapel}</h5><p>${u.nama}<br>${u.durasi} Menit</p>
                <button class="btn btn-primary" onclick="bukaToken('${u.id}', '${u.nama}', ${u.durasi})">Mulai</button></div></div>`
            ).join('') || '<div class="alert alert-warning w-100">Belum ada ujian.</div>';
        }
    }

    function bukaToken(id, nama, durasi) { aId = id; localStorage.setItem('tmp_dur', durasi); document.getElementById('lbl-ujian').innerText = nama; mToken.show(); }

    async function validasi() {
        let t = document.getElementById('input-token').value;
        let res = await fetchAPI('validasiToken', {ujian_id: aId, token: t});
        if(res.status === 'success') {
            mToken.hide(); 
            localStorage.setItem('run_exam', aId);
            resumeUjian(aId, false);
        } else alert(res.msg);
    }

    async function resumeUjian(id, isRes = true) {
        aId = id; document.getElementById('main-nav').classList.add('hidden'); document.getElementById('dashboard').classList.add('hidden'); document.getElementById('exam-engine').classList.remove('hidden');
        if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>{});
        
        let res = await fetchAPI('getSoal', {ujian_id: id});
        sData = res.data;
        jData = isRes && localStorage.getItem('ans_'+id) ? JSON.parse(localStorage.getItem('ans_'+id)) : {};
        if(!isRes) sData.forEach(s => jData[s.id] = {jwb: '', ragu: false});
        
        buildGrid(); loadSoal(0);
        let d = localStorage.getItem('tmp_dur') || 90;
        mulaiTimer(d);
    }

    function buildGrid() {
        let g = document.getElementById('grid'); g.innerHTML = '';
        sData.forEach((s, i) => {
            let b = document.createElement('button'); b.id = 'b-'+i; b.innerText = i+1; b.className = 'btn-nomor';
            b.onclick = () => loadSoal(i); g.appendChild(b); updateWarna(i);
        });
    }

    function loadSoal(i) {
        if(i<0 || i>=sData.length) return;
        document.querySelectorAll('.btn-nomor').forEach(b => b.classList.remove('active-soal')); document.getElementById('b-'+i).classList.add('active-soal');
        cIdx = i; let s = sData[i];
        document.getElementById('no-soal').innerText = i+1; document.getElementById('tanya').innerText = s.tanya; document.getElementById('cek-ragu').checked = jData[s.id].ragu;
        
        let area = document.getElementById('opsi'); area.innerHTML = '';
        if(s.tipe === 'PG') {
            ['a','b','c','d'].forEach(opt => {
                let chk = jData[s.id].jwb === opt ? 'checked' : '';
                area.innerHTML += `<div class="form-check mb-2 p-2 border rounded"><input class="form-check-input" type="radio" name="opt" value="${opt}" onchange="simpanJwb('${opt}')" ${chk}> <label class="ms-2">${s[opt]}</label></div>`;
            });
        } else {
            area.innerHTML = `<textarea class="form-control" rows="5" onkeyup="simpanJwb(this.value)">${jData[s.id].jwb}</textarea>`;
        }
    }

    function simpanJwb(v) { jData[sData[cIdx].id].jwb = v; updateWarna(cIdx); localStorage.setItem('ans_'+aId, JSON.stringify(jData)); }
    function tandaiRagu() { jData[sData[cIdx].id].ragu = document.getElementById('cek-ragu').checked; updateWarna(cIdx); localStorage.setItem('ans_'+aId, JSON.stringify(jData)); }
    function updateWarna(i) {
        let b = document.getElementById('b-'+i), j = jData[sData[i].id];
        b.className = 'btn-nomor ' + (i === cIdx ? 'active-soal ' : '');
        if(j.ragu) b.classList.add('bg-kuning'); else if(j.jwb.trim() !== '') b.classList.add('bg-hijau');
    }
    function nav(a) { loadSoal(cIdx + a); }

    function mulaiTimer(m) {
        let eT = localStorage.getItem('et_'+aId);
        if(!eT) { eT = new Date().getTime() + (m*60000); localStorage.setItem('et_'+aId, eT); }
        tInt = setInterval(() => {
            let dist = eT - new Date().getTime();
            if(dist < 0) { clearInterval(tInt); kirimData(); alert("Waktu Habis!"); }
            else {
                let h=Math.floor((dist%(1000*60*60*24))/(1000*60*60)), mn=Math.floor((dist%(1000*60*60))/(1000*60)), s=Math.floor((dist%(1000*60))/1000);
                document.getElementById('timer').innerText = `${h<10?'0'+h:h}:${mn<10?'0'+mn:mn}:${s<10?'0'+s:s}`;
            }
        }, 1000);
    }

    function submitAkhir() { if(confirm('Yakin ingin kumpulkan?')) kirimData(); }
    async function kirimData() {
        clearInterval(tInt); document.getElementById('timer').innerText = "SEND...";
        await fetchAPI('submitJawabanAkhir', {ujian_id: aId, jawaban: jData});
        localStorage.removeItem('run_exam'); localStorage.removeItem('ans_'+aId); localStorage.removeItem('et_'+aId);
        if(document.fullscreenElement) document.exitFullscreen(); location.reload();
    }
    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
</script>
</body></html>
