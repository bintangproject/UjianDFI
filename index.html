<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian - Darul Fawaid Ilmiyah</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; cursor: pointer; font-weight: bold; border: none; }
        button:hover { background: #219150; }
        .hidden { display: none; }
        .soal-card { background: #f9f9f9; padding: 15px; margin-bottom: 15px; border-left: 4px solid #3498db; }
    </style>
</head>
<body>

<div class="container" id="login-section">
    <h2>Login Portal Ujian<br><small>Darul Fawaid Ilmiyah</small></h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="login()">Masuk</button>
    <p id="msg" style="color:red; text-align:center;"></p>
</div>

<div class="container hidden" id="murid-section">
    <h2>Selamat Datang, <span id="nama-murid"></span></h2>
    <input type="text" id="mapel" placeholder="Masukkan Kode Mapel (contoh: PAI-7)">
    <button onclick="mulaiUjian()">Mulai Ujian</button>
    
    <div id="lembar-ujian" class="hidden">
        <hr>
        <div id="tempat-soal"></div>
        <button onclick="submitUjian()" style="background:#e74c3c;">Kumpulkan Jawaban</button>
    </div>
</div>

<div class="container hidden" id="guru-section">
    <h2>Dashboard Guru/Admin</h2>
    <p>Selamat datang! Untuk menginput soal atau memberikan nilai manual (Isian/Uraian), silakan buka langsung <b>Google Spreadsheet</b> Anda.</p>
    <button onclick="location.reload()">Logout</button>
</div>

<script>
    // === MASUKKAN URL APPS SCRIPT ANDA DI SINI ===
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybpeIedWVkMeqxwytE3acxqs8iGQURFALWL8ANCdLymf9m0CYZSK1ndCSWUJug1DFw0w/exec'; 

    let currentUser = '';
    let currentMapel = '';
    let dataSoal = [];

    async function fetchData(action, payload) {
        payload.action = action;
        let response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });
        return await response.json();
    }

    async function login() {
        let u = document.getElementById('username').value;
        let p = document.getElementById('password').value;
        document.getElementById('msg').innerText = "Loading...";
        
        let res = await fetchData('login', {username: u, password: p});
        
        if(res.status === 'success') {
            document.getElementById('login-section').classList.add('hidden');
            if(res.role === 'Murid') {
                document.getElementById('murid-section').classList.remove('hidden');
                document.getElementById('nama-murid').innerText = res.nama;
                currentUser = u;
            } else {
                document.getElementById('guru-section').classList.remove('hidden');
            }
        } else {
            document.getElementById('msg').innerText = res.message;
        }
    }

    async function mulaiUjian() {
        currentMapel = document.getElementById('mapel').value;
        if(!currentMapel) return alert('Isi mapel dulu!');
        
        document.getElementById('tempat-soal').innerHTML = "Memuat soal...";
        document.getElementById('lembar-ujian').classList.remove('hidden');

        let res = await fetchData('getSoal', {mapel: currentMapel});
        
        if(res.status === 'success' && res.data.length > 0) {
            dataSoal = res.data;
            renderSoal();
        } else {
            document.getElementById('tempat-soal').innerHTML = "Soal tidak ditemukan untuk mapel ini.";
        }
    }

    function renderSoal() {
        let html = '';
        dataSoal.forEach((soal, index) => {
            html += `<div class="soal-card">
                        <p><b>${index+1}. ${soal.pertanyaan}</b></p>`;
            
            if(soal.jenis === 'PG') {
                ['a','b','c','d'].forEach(opt => {
                    let nilaiOpsi = soal['opsi_'+opt];
                    if(nilaiOpsi) {
                        html += `<label><input type="radio" name="soal_${soal.id_soal}" value="${opt}"> ${nilaiOpsi}</label><br>`;
                    }
                });
            } else if (soal.jenis === 'Isian' || soal.jenis === 'Uraian') {
                html += `<textarea id="soal_${soal.id_soal}" rows="3" style="width:100%"></textarea>`;
            }
            html += `</div>`;
        });
        document.getElementById('tempat-soal').innerHTML = html;
    }

    async function submitUjian() {
        let jawabanKirim = [];
        let lengkap = true;

        dataSoal.forEach(soal => {
            let jwb = '';
            if(soal.jenis === 'PG') {
                let checked = document.querySelector(`input[name="soal_${soal.id_soal}"]:checked`);
                if(checked) jwb = checked.value;
            } else {
                jwb = document.getElementById(`soal_${soal.id_soal}`).value;
            }

            if(!jwb) lengkap = false;

            jawabanKirim.push({
                id_soal: soal.id_soal,
                jenis: soal.jenis,
                jawaban_murid: jwb
            });
        });

        if(!lengkap) {
            if(!confirm('Ada soal yang belum dijawab. Yakin ingin mengumpulkan?')) return;
        }

        document.getElementById('tempat-soal').innerHTML = "Mengirim jawaban, mohon tunggu...";
        
        let res = await fetchData('submitJawaban', {
            username: currentUser,
            mapel: currentMapel,
            jawaban: jawabanKirim
        });

        if(res.status === 'success') {
            document.getElementById('tempat-soal').innerHTML = "<h3>Ujian Selesai! Jawaban berhasil disimpan.</h3>";
            document.querySelector('#lembar-ujian button').classList.add('hidden');
        }
    }
</script>
</body>
</html>
