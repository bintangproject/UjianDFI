<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CBT Darul Fawaid Ilmiyah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #2c3e50; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
<div class="login-card text-center">
    <i class="fas fa-graduation-cap fa-4x text-primary mb-3"></i>
    <h4 class="text-dark">Portal Ujian CBT</h4>
    <p class="text-muted small mb-4">Darul Fawaid Ilmiyah</p>
    <form onsubmit="prosesLogin(event)">
        <input type="text" id="username" class="form-control mb-3" placeholder="Username" required>
        <input type="password" id="password" class="form-control mb-4" placeholder="Password" required>
        <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnLogin">MASUK</button>
    </form>
    <div id="msg" class="text-danger mt-3 small"></div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbybpeIedWVkMeqxwytE3acxqs8iGQURFALWL8ANCdLymf9m0CYZSK1ndCSWUJug1DFw0w/exec';

    async function prosesLogin(e) {
        e.preventDefault();
        let btn = document.getElementById('btnLogin');
        let msg = document.getElementById('msg');
        
        // Ambil nilai dengan cara yang aman
        let valUser = document.getElementById('username').value;
        let valPass = document.getElementById('password').value;
        
        btn.innerHTML = 'Memproses...'; btn.disabled = true; msg.innerHTML = '';

        try {
            let res = await fetch(API_URL, {
                method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({action: 'login', username: valUser, password: valPass})
            }).then(r => r.json());

            if (res.status === 'success') {
                localStorage.setItem('cbt_user_id', res.user_id);
                localStorage.setItem('cbt_role', res.role);
                localStorage.setItem('cbt_nama', res.nama);
                localStorage.setItem('cbt_kelas', res.kelas);
                localStorage.setItem('cbt_mapel', res.mapel);
                localStorage.setItem('cbt_token', res.token);
                
                if (res.role === 'Admin') window.location.href = 'admin.html';
                else if (res.role === 'Guru') window.location.href = 'guru.html';
                else window.location.href = 'ujian.html';
            } else { msg.innerHTML = res.msg; }
        } catch (err) { msg.innerHTML = "Gagal terhubung ke server."; }
        btn.innerHTML = 'MASUK'; btn.disabled = false;
    }
</script>
</body></html>
