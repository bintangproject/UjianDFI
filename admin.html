<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - CBT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; display: flex; margin:0; }
        #sidebar { width: 250px; background: #1e2b3c; min-height: 100vh; color: #fff; padding-top: 20px;}
        #sidebar a { color: #cbd5e1; padding: 15px; display: block; text-decoration: none; }
        #sidebar a:hover, .active { background: #2c3e50; border-left: 4px solid #e74c3c; color: white !important;}
        #content { flex-grow: 1; padding: 20px; }
        .panel { display: none; } .panel.active { display: block; }
        .card-stat { padding: 20px; border-radius: 10px; color: white; }
    </style>
</head>
<body>
<div id="sidebar">
    <div class="text-center mb-4"><i class="fas fa-shield-alt fa-3x text-danger mb-2"></i><h5>Super Admin</h5><small id="nama-admin"></small></div>
    <a href="#" class="active" onclick="gantiTab('dashboard', this)"><i class="fas fa-desktop me-2"></i> Dashboard</a>
    <a href="#" onclick="gantiTab('ujian', this)"><i class="fas fa-laptop-code me-2"></i> Manajemen Ujian</a>
    <a href="#" onclick="logout()" class="text-danger mt-5"><i class="fas fa-sign-out-alt me-2"></i> Keluar</a>
</div>

<div id="content">
    <div id="panel-dashboard" class="panel active">
        <h4 class="mb-4">Dashboard Utama</h4>
        <div class="row g-3">
            <div class="col-md-4"><div class="card-stat bg-primary"><h6>Total Peserta</h6><h2 id="st-peserta">...</h2></div></div>
            <div class="col-md-4"><div class="card-stat bg-success"><h6>Total Guru</h6><h2 id="st-guru">...</h2></div></div>
            <div class="col-md-4"><div class="card-stat bg-warning text-dark"><h6>Jadwal Ujian</h6><h2 id="st-ujian">...</h2></div></div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card p-3 shadow-sm border-0"><h5>Master Peserta</h5>
                <table class="table table-sm"><thead><tr><th>UID</th><th>NIS</th><th>Kelas</th></tr></thead><tbody id="tb-peserta"></tbody></table></div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 shadow-sm border-0"><h5>Master Guru</h5>
                <table class="table table-sm"><thead><tr><th>UID</th><th>NIP</th><th>Mapel</th></tr></thead><tbody id="tb-guru"></tbody></table></div>
            </div>
        </div>
    </div>

    <div id="panel-ujian" class="panel">
        <div class="d-flex justify-content-between mb-4">
            <h4>Manajemen Ujian</h4>
            <button class="btn btn-primary" onclick="buatToken()"><i class="fas fa-plus"></i> Ujian Baru</button>
        </div>
        
        <div id="form-ujian" class="card p-3 mb-4" style="display:none;">
            <div class="row g-2">
                <div class="col-3"><input type="text" id="u-mapel" class="form-control" placeholder="Mapel (cth: Fiqih)"></div>
                <div class="col-3"><input type="text" id="u-kelas" class="form-control" placeholder="Kelas (cth: VII-A)"></div>
                <div class="col-2"><input type="date" id="u-tgl" class="form-control"></div>
                <div class="col-2"><input type="number" id="u-durasi" class="form-control" placeholder="Menit" value="90"></div>
                <div class="col-2"><input type="text" id="u-token" class="form-control" readonly></div>
                <div class="col-12 text-end"><button class="btn btn-success" onclick="simpanUjian()">Simpan Jadwal</button></div>
            </div>
        </div>
        
        <div class="card p-3 shadow-sm border-0">
            <table class="table"><thead><tr><th>ID</th><th>Mapel</th><th>Kelas</th><th>Durasi</th><th>Token</th><th>Status</th></tr></thead><tbody id="tb-ujian"></tbody></table>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbybpeIedWVkMeqxwytE3acxqs8iGQURFALWL8ANCdLymf9m0CYZSK1ndCSWUJug1DFw0w/exec';

    async function fetchAPI(action, payload = {}) {
        payload.action = action; payload.user_id = localStorage.getItem('cbt_user_id');
        return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) }).then(r=>r.json());
    }

    window.onload = () => {
        if(localStorage.getItem('cbt_role') !== 'Admin') window.location.href = 'index.html';
        document.getElementById('nama-admin').innerText = localStorage.getItem('cbt_nama');
        loadDataAdmin();
    };

    function gantiTab(id, el) {
        document.querySelectorAll('#sidebar a').forEach(a => a.classList.remove('active')); el.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active')); document.getElementById('panel-'+id).classList.add('active');
    }

    async function loadDataAdmin() {
        let res = await fetchAPI('getAdminData');
        if(res.status === 'success') {
            document.getElementById('st-peserta').innerText = res.data.stats.p;
            document.getElementById('st-guru').innerText = res.data.stats.g;
            document.getElementById('st-ujian').innerText = res.data.stats.u;
            
            document.getElementById('tb-peserta').innerHTML = res.data.peserta.map(p => `<tr><td>${p.uid}</td><td>${p.nis}</td><td>${p.kelas}</td></tr>`).join('');
            document.getElementById('tb-guru').innerHTML = res.data.guru.map(g => `<tr><td>${g.uid}</td><td>${g.nip}</td><td>${g.mapel}</td></tr>`).join('');
            document.getElementById('tb-ujian').innerHTML = res.data.ujian.map(u => `<tr><td>${u.id}</td><td>${u.mapel}</td><td>${u.kelas}</td><td>${u.durasi}</td><td><b>${u.token}</b></td><td>${u.status}</td></tr>`).join('');
        }
    }

    function buatToken() {
        document.getElementById('form-ujian').style.display = 'block';
        document.getElementById('u-token').value = Math.random().toString(36).substr(2, 5).toUpperCase();
    }

    async function simpanUjian() {
        let p = { 
            mapel: document.getElementById('u-mapel').value, 
            kelas: document.getElementById('u-kelas').value, 
            tanggal: document.getElementById('u-tgl').value, 
            durasi: document.getElementById('u-durasi').value, 
            token: document.getElementById('u-token').value 
        };
        let res = await fetchAPI('tambahUjianBaru', p);
        if(res.status === 'success') { alert('Berhasil!'); location.reload(); }
    }
    
    function logout() { localStorage.clear(); window.location.href = 'index.html'; }
</script>
</body></html>
